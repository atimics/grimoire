[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "daem0nmcp"
version = "0.1.0"
description = "Persistent AI memory management for Claude Code/Desktop"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=0.1.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
daem0nmcp = "daem0nmcp.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["daem0nmcp*"]
